      - name: Package add-on
        run: |
          cd packs
          zip -qr ../ModernHouseBuilder.mcaddon ModernHouseBuilder_BP ModernHouseBuilder_RP
          cd ..
          cp ModernHouseBuilder.mcaddon ios-installer/Resources/
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios-installer
        run: xcodegen generate
      - name: Build (unsigned)
        working-directory: ios-installer
        run: |
          xcodebuild -project HouseBuilder.xcodeproj -scheme HouseBuilder \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package unsigned IPA
        working-directory: ios-installer
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HouseBuilder.app Payload/
          zip -qry ModernHouseBuilder-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ModernHouseBuilder-unsigned-ipa
          path: ios-installer/ModernHouseBuilder-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ModernHouseBuilder-mcaddon
          path: ModernHouseBuilder.mcaddon
